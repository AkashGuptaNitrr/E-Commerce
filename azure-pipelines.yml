trigger:
  - main   # Runs pipeline on commits to main branch

pool:
  vmImage: 'ubuntu-latest'

variables:
  acrName: ecommerceacr7   # Replace with your ACR name
  dockerRegistryServiceConnection: 'acr-service-connection'
  azureSubscriptionServiceConnection: 'azure-subscription-connection'
  resourceGroup: 'ecommerce-rg'
  aksCluster: 'ecommerce-aks'

steps:
#  - task: UseJavaVersion@1
#    inputs:
#      versionSpec: '17'
#      architecture: 'x64'

  - task: Maven@3
    displayName: Build Config Server
    inputs:
      mavenPomFile: 'Backend/config-server/pom.xml'
      goals: 'clean install'

  - task: Maven@3
    displayName: Build Product Service
    inputs:
      mavenPomFile: 'Backend/product-service/pom.xml'
      goals: 'clean install'

  # 2. Build & Push Config Server Docker Image
  - task: Docker@2
    inputs:
      command: buildAndPush
      repository: config-server
      dockerfile: Backend/config-server/Dockerfile
      containerRegistry: $(dockerRegistryServiceConnection)
      tags: |
        $(Build.BuildId)

  # 3. Deploy Config Server to AKS
  - task: Kubernetes@1
    displayName: Deploy Config Server to AKS
    inputs:
      connectionType: 'Azure Resource Manager'
      azureSubscriptionEndpoint: azure-subscription-connection
      azureResourceGroup: ecommerce-rg
      kubernetesCluster: ecommerce-aks
      namespace: 'default'
      command: apply
      useConfigurationFile: true
      configuration: 'k8s/config-server-deployment.yml'

  # 4. Build & Push Product Service Docker Image
  - task: Docker@2
    inputs:
      command: buildAndPush
      repository: product-service
      dockerfile: Backend/product-service/Dockerfile
      containerRegistry: $(dockerRegistryServiceConnection)
      tags: |
        $(Build.BuildId)

  # 5. Deploy Product Service to AKS
  - task: Kubernetes@1
    displayName: Deploy Product Service to AKS
    inputs:
      connectionType: 'Azure Resource Manager'
      azureSubscriptionEndpoint: azure-subscription-connection
      azureResourceGroup: ecommerce-rg
      kubernetesCluster: ecommerce-aks
      namespace: 'default'
      command: apply
      useConfigurationFile: true
      configuration: 'k8s/product-service-deployment.yml'

  # 6. Deploy Product Service LoadBalancer Service to AKS
  - task: Kubernetes@1
    displayName: Expose Product Service with LoadBalancer
    inputs:
      connectionType: 'Azure Resource Manager'
      azureSubscriptionEndpoint: azure-subscription-connection
      azureResourceGroup: ecommerce-rg
      kubernetesCluster: ecommerce-aks
      namespace: 'default'
      command: apply
      useConfigurationFile: true
      configuration: 'k8s/product-service-service.yml'